<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="calculator">

        <!-- Display screen -->
        <div class="display" aria-live="polite">
            <div class="expression" id="expression"></div>
            <div class="result" id="result">0</div>
        </div>

        <!-- Buttons -->
        <div class="keys">
            <button class="key clear" data-action="clear" aria-label="All clear">AC</button>
            <button class="key clear" data-action="delete" aria-label="Delete last digit">DEL</button>
            <button class="key function" data-action="percent" aria-label="Percent">%</button>
            <button class="key operator" data-action="operator" data-value="/" aria-label="Divide">&divide;</button>

            <button class="key" data-action="number" data-value="7">7</button>
            <button class="key" data-action="number" data-value="8">8</button>
            <button class="key" data-action="number" data-value="9">9</button>
            <button class="key operator" data-action="operator" data-value="*" aria-label="Multiply">&times;</button>

            <button class="key" data-action="number" data-value="4">4</button>
            <button class="key" data-action="number" data-value="5">5</button>
            <button class="key" data-action="number" data-value="6">6</button>
            <button class="key operator" data-action="operator" data-value="-" aria-label="Subtract">&minus;</button>

            <button class="key" data-action="number" data-value="1">1</button>
            <button class="key" data-action="number" data-value="2">2</button>
            <button class="key" data-action="number" data-value="3">3</button>
            <button class="key operator" data-action="operator" data-value="+" aria-label="Add">+</button>

            <button class="key zero" data-action="number" data-value="0">0</button>
            <button class="key" data-action="decimal" aria-label="Decimal point">.</button>
            <button class="key equals" data-action="equals" aria-label="Equals">=</button>
        </div>

        <p class="hint">Keyboard: 0-9 + - * / . % &middot; Enter = &middot; Backspace delete &middot; Esc clear</p>
    </main>

    <script src="script.js"></script>
</body>
</html>
